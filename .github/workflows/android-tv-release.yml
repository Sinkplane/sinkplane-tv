name: Android TV Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile
        type: choice
        options:
          - preview_tv
          - production_tv
          - development_tv
        default: preview_tv
      mark_prerelease:
        description: Mark the GitHub release as a pre-release
        type: boolean
        default: false

concurrency:
  group: android-tv-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: read

jobs:
  android-tv-release:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm/action-setup reads the version from package.json "packageManager"
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install EAS CLI
        run: npm install --global eas-cli@latest

      # EAS CLI evaluates app.json (including config plugins) on the runner
      # before scheduling a remote build, so node_modules must exist locally.
      # pnpm ignores ${...} in the repo .npmrc; write the token to the
      # user-level .npmrc instead (same as local dev — see AGENTS.md).
      - name: Configure GitHub Packages auth
        env:
          PACKAGES_AUTH_TOKEN: ${{ secrets.PACKAGES_AUTH_TOKEN }}
        run: echo "//npm.pkg.github.com/:_authToken=${PACKAGES_AUTH_TOKEN}" >> ~/.npmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Resolve release tag
        id: tag
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(jq -r '.expo.version' app.json)
            echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          fi

      # NOTE: do NOT "normalize" the multi-document pnpm-lock.yaml before
      # `eas build`. pnpm 12 natively writes a two-document lockfile
      # (self-management stub + lockfile) and the EAS worker's pnpm accepts
      # it as-is. Stripping the stub doc makes pnpm reject the file
      # (ERR_PNPM_NO_LOCKFILE / outdated packageManagerDependencies).

      - name: Run EAS build for Android TV
        id: build
        run: |
          PROFILE="${{ inputs.profile || 'preview_tv' }}"
          eas build \
            --platform android \
            --profile "$PROFILE" \
            --non-interactive \
            --json \
            | tee eas-build.json
          BUILD_URL=$(jq -r '.[0].artifacts.buildUrl' eas-build.json)
          if [ -z "$BUILD_URL" ] || [ "$BUILD_URL" = "null" ]; then
            echo "EAS build did not return an artifact URL" >&2
            exit 1
          fi
          echo "url=$BUILD_URL" >> "$GITHUB_OUTPUT"

      - name: Print EAS build diagnostics on failure
        if: failure()
        run: |
          if [ -s eas-build.json ] && jq -e 'type == "array"' eas-build.json > /dev/null 2>&1; then
            jq -r '.[0] | "EAS build \(.id): status=\(.status)"' eas-build.json
            echo "Full logs: https://expo.dev/accounts/sinkplane/projects/sinkplane/builds"
          else
            echo "eas-build.json is empty or invalid — build failed before scheduling"
            cat eas-build.json 2>/dev/null || true
          fi

      - name: Download build artifact
        run: |
          URL="${{ steps.build.outputs.url }}"
          EXT="${URL##*.}"
          TAG="${{ steps.tag.outputs.tag }}"
          curl --fail --location --output "sinkplane-tv-${TAG#v}.${EXT}" "$URL"

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          PRERELEASE_FLAG: ${{ inputs.mark_prerelease && '--prerelease' || '' }}
        run: |
          FILE=$(ls sinkplane-tv-*)
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$FILE" \
              --title "Sinkplane TV $TAG" \
              --generate-notes \
              --target "$GITHUB_SHA" \
              $PRERELEASE_FLAG \
              --repo "$GITHUB_REPOSITORY"
          fi
